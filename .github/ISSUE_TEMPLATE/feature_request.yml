name: 功能建议
description: 提出新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请描述实际使用场景，而非直接给方案
      placeholder: 我在读英文技术文档时，经常需要…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）

  - type: checkboxes
    id: checked
    attributes:
      label: 确认
      options:
        - label: 我已查阅 [设计文档](../../blob/develop/docs/lingostack-design.md)，确认此功能未被规划或需调整优先级
          required: true
