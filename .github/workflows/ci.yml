name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# 同一分支的新运行取消旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # libappindicator3-dev 与 libayatana-appindicator3-dev 互斥（Conflicts），
      # 同时安装会导致 apt 报 broken packages。Tauri 2 用 ayatana 分支，故只装它。
      - name: 安装 Tauri 所需 Linux 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2

      # tauri::generate_context! 在编译期校验 frontendDist（../dist）存在，
      # 故 Rust 侧任何检查前都必须先产出前端构建物，否则 proc macro panic。
      # 不指定 version：版本单一真源为 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 构建前端产物（dist/）
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: Verify third-party notices
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          pnpm notices:generate
          git diff --exit-code -- THIRD_PARTY_NOTICES

      # 显式指定 bash：Windows runner 默认 shell 是 pwsh，`if ...; then` 这类
      # POSIX 语法会被 PowerShell 解析器拒绝（Missing '(' after 'if'）。
      # Windows runner 自带 Git Bash，指定后三平台走同一份脚本。
      - name: lingostack-core 纯净性校验（禁止依赖 tauri）
        shell: bash
        run: |
          if cargo tree -p lingostack-core | grep -iw tauri; then
            echo "::error::lingostack-core 依赖了 tauri，违反纯净约束（见 CLAUDE.md）"
            exit 1
          else
            echo "::notice::lingostack-core 保持纯净（无 tauri 依赖）"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 不指定 version：由 package.json 的 packageManager 字段决定版本。
      # 两处同时声明会触发 action 的版本冲突检查而直接失败。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

  e2e-windows:
    name: Desktop E2E (Windows embedded)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run real Tauri E2E
        run: pnpm test:e2e

      - name: Upload desktop E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-windows
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: 14
