[workspace]
resolver = "2"
members = [
    "crates/lingostack-core",
    "crates/lingostack-llm",
    "crates/lingostack-selection",
    "crates/lingostack-hook",
    "crates/lingostack-tts",
    "crates/lingostack-docparse",
    "crates/lingostack-document",
    "src-tauri",
]

[workspace.package]
version = "0.0.6"
edition = "2021"
rust-version = "1.85"
authors = ["夏超"]
license = "MIT"
publish = false

[workspace.dependencies]
# 内部 crate
lingostack-core = { path = "crates/lingostack-core" }
lingostack-llm = { path = "crates/lingostack-llm" }
lingostack-selection = { path = "crates/lingostack-selection" }
lingostack-hook = { path = "crates/lingostack-hook" }
lingostack-tts = { path = "crates/lingostack-tts" }
lingostack-docparse = { path = "crates/lingostack-docparse" }
lingostack-document = { path = "crates/lingostack-document" }

# 共享外部依赖（统一版本）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pulldown-cmark = { version = "0.12.2", default-features = false }
encoding_rs = "0.8.35"
pdf-extract = "0.12.0"
quick-xml = "0.41.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

# 异步 / HTTP（lingostack-llm 使用；rustls-tls 免系统 OpenSSL，Windows 友好）
futures = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# Tauri（仅 lingostack-app / lingostack-hook 使用）
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2" }

# 仅测试（lingostack-llm 集成测试 / src-tauri 临时文件）
wiremock = "0.6"
tempfile = "3"

# Tauri 插件与系统能力（src-tauri 使用）
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-wdio = "1.3.0"
tauri-plugin-wdio-webdriver = "1.3.0"
dirs = "6"

# Windows 原生 API（取词 / TTS）。版本对齐 tauri 的传递依赖，避免重复编译。
windows = "0.61"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
