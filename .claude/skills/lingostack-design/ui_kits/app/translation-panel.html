<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>翻译面板 · 译栈 UI Kit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../tokens.css" />
  <link rel="stylesheet" href="kit.css" />
  <style>
    .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .pane{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden;min-height:280px}
    .pane-label{padding:9px 14px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
    .pane-body{padding:14px;font-size:14px;line-height:1.75;color:var(--fg);flex:1}
    .pane-body.muted{color:var(--fg-2)}
    .pane-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--border);background:rgba(255,255,255,.012)}
    .pane-foot .meta{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
    .live{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--info)}
    .live .d{width:6px;height:6px;border-radius:50%;background:var(--info);animation:pulse 1s infinite}
    @keyframes pulse{50%{opacity:.25}}
    .cursor{display:inline-block;width:2px;height:1.05em;background:var(--info);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media(max-width:760px){.split{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="titlebar"><span class="tl"></span><span class="tl"></span><span class="tl"></span><span class="t">翻译面板 · 译栈 LingoStack</span></div>
    <div class="kit-body">
      <aside class="sidebar">
        <div class="sb-brand"><img src="../../assets/brand-mark.svg" alt="" />译栈</div>
        <a class="nav-item" href="index.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>概览</a>
        <a class="nav-item active" href="translation-panel.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7M9 3v2c0 4.4-2.7 8.5-6.5 10.5"/><path d="M5 9c1.2 2.6 3.8 4.6 6.5 5.5"/><path d="M14 20l3-7 3 7M15.3 17.5h3.4"/></svg>翻译面板</a>
        <a class="nav-item" href="buttons.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="4"/></svg>按钮</a>
        <a class="nav-item" href="surfaces.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>表面</a>
        <a class="nav-item" href="forms.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>表单</a>
        <a class="nav-item" href="navigation.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>导航</a>
        <a class="nav-item" href="overlays.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 4.5-3.2 7.6-8 9-4.8-1.4-8-4.5-8-9V7z"/></svg>浮层</a>
        <div class="sb-foot">托盘常驻 · 零遥测<br/>UI Kit v1 · MIT</div>
      </aside>

      <div class="main">
        <section class="panel">
          <p class="eyebrow">签名表面 · 翻译面板</p>
          <h2>原文在上，译文逐字流式而下。</h2>
          <p class="desc">点击「翻译」重看逐字流式渲染；保留术语（<span class="keep">in-flight</span>、<span class="keep">timeout</span>）原样保留。这是译栈最高频的交互。</p>

          <div class="split">
            <div class="pane">
              <div class="pane-label">原文 · 自动检测</div>
              <div class="pane-body muted"><textarea id="src" style="width:100%;height:100%;min-height:200px;border:0;background:transparent;color:var(--fg-2);font:inherit;font-size:14px;line-height:1.75;resize:none;outline:none">The graceful shutdown handler waits for in-flight requests to complete before terminating the process, with a configurable timeout to force-exit if they hang.</textarea></div>
              <div class="pane-foot"><span class="meta" id="count">138 字符</span><button class="act primary" id="trBtn">翻译</button></div>
            </div>
            <div class="pane">
              <div class="pane-label">译文 · 中文 <span class="live" id="live"><span class="d"></span>流式</span></div>
              <div class="pane-body" id="out"></div>
              <div class="pane-foot"><span class="meta">DeepSeek · deepseek-chat</span>
                <div class="row-x" style="gap:4px">
                  <button class="icon-btn" data-act="speak" title="朗读"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
                  <button class="icon-btn" data-act="fav" title="收藏"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
                  <button class="icon-btn" data-act="copy" title="复制"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <div class="statusbar"><span><span class="dot"></span>就绪</span><span>模型：DeepSeek · deepseek-chat</span><span class="sp">内存 84MB · CPU 0%</span></div>
  </div>

  <script>
    function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
    var parts=[
      {s:"优雅停机处理器会等待 "},
      {s:"in-flight",c:"keep"},
      {s:" 请求完成后再终止进程，并设有可配置的 "},
      {s:"timeout",c:"keep"},
      {s:"，在请求卡住时强制退出。"}
    ];
    var total=parts.reduce(function(n,p){return n+p.s.length;},0);
    var out=document.getElementById('out'),live=document.getElementById('live');
    function build(count){var html='',left=count;for(var i=0;i<parts.length;i++){var p=parts[i];if(left<=0)break;if(p.s.length<=left){html+=p.c?'<span class="'+p.c+'">'+esc(p.s)+'</span>':esc(p.s);left-=p.s.length;}else{var seg=p.s.slice(0,left);html+=p.c?'<span class="'+p.c+'">'+esc(seg)+'</span>':esc(seg);break;}}return html;}
    var timer=null,count2=0;
    function stream(){clearInterval(timer);count2=0;out.innerHTML='<span class="cursor"></span>';live.innerHTML='<span class="d"></span>流式';live.style.color='var(--info)';
      timer=setInterval(function(){count2+=2;if(count2>=total){count2=total;clearInterval(timer);out.innerHTML=build(total);live.innerHTML='<span class="d" style="background:var(--success)"></span>已完成';live.style.color='var(--success)';return;}out.innerHTML=build(count2)+'<span class="cursor"></span>';},24);}
    stream();
    document.getElementById('trBtn').addEventListener('click',stream);
    var src=document.getElementById('src'),countEl=document.getElementById('count');
    src.addEventListener('input',function(){countEl.textContent=src.value.length+' 字符';});
  </script>
</body>
</html>
