<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>表单 · 译栈 UI Kit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../tokens.css" />
  <link rel="stylesheet" href="kit.css" />
</head>
<body>
  <div class="shell">
    <div class="titlebar"><span class="tl"></span><span class="tl"></span><span class="tl"></span><span class="t">表单 · 译栈 LingoStack</span></div>
    <div class="kit-body">
      <aside class="sidebar">
        <div class="sb-brand"><img src="../../assets/brand-mark.svg" alt="" />译栈</div>
        <a class="nav-item" href="index.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>概览</a>
        <a class="nav-item" href="translation-panel.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7M9 3v2c0 4.4-2.7 8.5-6.5 10.5"/><path d="M5 9c1.2 2.6 3.8 4.6 6.5 5.5"/><path d="M14 20l3-7 3 7M15.3 17.5h3.4"/></svg>翻译面板</a>
        <a class="nav-item" href="buttons.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="4"/></svg>按钮</a>
        <a class="nav-item" href="surfaces.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>表面</a>
        <a class="nav-item active" href="forms.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>表单</a>
        <a class="nav-item" href="navigation.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>导航</a>
        <a class="nav-item" href="overlays.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 4.5-3.2 7.6-8 9-4.8-1.4-8-4.5-8-9V7z"/></svg>浮层</a>
        <div class="sb-foot">托盘常驻 · 零遥测<br/>UI Kit v1 · MIT</div>
      </aside>

      <div class="main">
        <section class="panel">
          <p class="eyebrow">组件 · 表单</p>
          <h2>输入聚焦，天蓝环点亮。</h2>
          <p class="desc">输入框 <span class="keep">--bg</span> 底 + 细边框；focus 隐藏 outline，改用 focus 环 + 1px 天蓝描边。单选用凹槽式卡片，热键冲突标红。</p>

          <h3 class="sec-title">字段</h3>
          <div class="grid2" style="margin-bottom:6px">
            <label class="field"><span>中文描述</span><input class="input" value="获取用户资料" /></label>
            <label class="field"><span>API 端点</span><input class="input mono" value="https://api.deepseek.com" style="font-family:var(--font-mono);font-size:13px" /></label>
            <label class="field"><span>搜索词条</span><input class="input" placeholder="输入以筛选…" /></label>
            <label class="field"><span>默认模型</span>
              <select class="select"><option>DeepSeek · deepseek-chat</option><option>Anthropic · claude-sonnet-5</option></select>
            </label>
          </div>

          <h3 class="sec-title">文本域 · Prompt</h3>
          <label class="field" style="max-width:560px;margin-bottom:6px"><span>翻译 Prompt</span><textarea class="textarea" rows="3" placeholder="遵循开发行业语言，避让产品名 / 变量名 / 命令名，意译而非直译…"></textarea></label>

          <h3 class="sec-title">单选组 · 主题</h3>
          <div class="radio-row" style="margin-bottom:6px">
            <label class="radio"><input type="radio" name="theme"> 浅色</label>
            <label class="radio on"><input type="radio" name="theme" checked> 深色</label>
            <label class="radio"><input type="radio" name="theme"> 跟随系统</label>
          </div>

          <h3 class="sec-title">热键行（含冲突态）</h3>
          <div style="display:flex;flex-direction:column;gap:8px;max-width:560px">
            <div class="hotkey-row"><span style="font-size:14px;color:var(--fg-2);min-width:130px">划词唤起</span><span class="mono" style="font-size:11px;color:var(--muted);flex:1">任意应用选中文本</span><span style="display:inline-flex;gap:4px"><span class="kbd">⌥</span><span class="kbd">Space</span></span></div>
            <div class="hotkey-row conflict"><span style="font-size:14px;color:var(--fg-2);min-width:130px">打开主窗口</span><span class="mono" style="font-size:11px;color:var(--accent);flex:1">已被系统占用</span><span style="display:inline-flex;gap:4px"><span class="kbd">⌘</span><span class="kbd">⇧</span><span class="kbd">L</span></span></div>
          </div>
        </section>
      </div>
    </div>
    <div class="statusbar"><span><span class="dot"></span>就绪</span><span>组件：forms</span><span class="sp">令牌：tokens.css · kit.css</span></div>
  </div>
</body>
</html>
