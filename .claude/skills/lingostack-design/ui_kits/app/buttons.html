<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按钮 · 译栈 UI Kit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../tokens.css" />
  <link rel="stylesheet" href="kit.css" />
</head>
<body>
  <div class="shell">
    <div class="titlebar"><span class="tl"></span><span class="tl"></span><span class="tl"></span><span class="t">按钮 · 译栈 LingoStack</span></div>
    <div class="kit-body">
      <aside class="sidebar">
        <div class="sb-brand"><img src="../../assets/brand-mark.svg" alt="" />译栈</div>
        <a class="nav-item" href="index.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>概览</a>
        <a class="nav-item" href="translation-panel.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7M9 3v2c0 4.4-2.7 8.5-6.5 10.5"/><path d="M5 9c1.2 2.6 3.8 4.6 6.5 5.5"/><path d="M14 20l3-7 3 7M15.3 17.5h3.4"/></svg>翻译面板</a>
        <a class="nav-item active" href="buttons.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="4"/></svg>按钮</a>
        <a class="nav-item" href="surfaces.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>表面</a>
        <a class="nav-item" href="forms.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>表单</a>
        <a class="nav-item" href="navigation.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>导航</a>
        <a class="nav-item" href="overlays.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 4.5-3.2 7.6-8 9-4.8-1.4-8-4.5-8-9V7z"/></svg>浮层</a>
        <div class="sb-foot">托盘常驻 · 零遥测<br/>UI Kit v1 · MIT</div>
      </aside>

      <div class="main">
        <section class="panel">
          <p class="eyebrow">组件 · 按钮</p>
          <h2>每屏一个主操作，其余全部退后。</h2>
          <p class="desc">主按钮近白底黑字、药丸圆角；次按钮透明 + 细边框；ghost 仅文字。hover 永远把背景往亮处移，绝不让文字变灰。</p>

          <h3 class="sec-title">按钮族</h3>
          <div class="card" style="margin-bottom:14px"><div class="row-x">
            <button class="btn btn-primary">进入主窗口</button>
            <button class="btn btn-secondary">查看划词交互</button>
            <button class="btn btn-ghost">返回总览</button>
            <button class="btn btn-primary" disabled>已禁用</button>
          </div></div>

          <h3 class="sec-title">紧凑动作</h3>
          <div class="card" style="margin-bottom:14px"><div class="row-x">
            <button class="act primary">翻译</button>
            <button class="act">导入 JSON</button>
            <button class="act">导出 JSON</button>
            <button class="act on">收藏</button>
          </div></div>

          <h3 class="sec-title">图标按钮</h3>
          <div class="card"><div class="row-x">
            <button class="icon-btn" title="朗读"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
            <button class="icon-btn" title="收藏"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
            <button class="icon-btn" title="复制"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
            <button class="icon-btn on" title="置顶"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 7 3 3H7l3-3-1-7z"/></svg></button>
            <button class="icon-btn" title="关闭"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div></div>
        </section>
      </div>
    </div>
    <div class="statusbar"><span><span class="dot"></span>就绪</span><span>组件：buttons</span><span class="sp">令牌：tokens.css · kit.css</span></div>
  </div>
</body>
</html>
